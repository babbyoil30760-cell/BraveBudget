<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>บัญชีรายรับ-รายจ่าย</title>
<style>
  :root {
    --bg: #f4f6f8;
    --surface: #ffffff;
    --surface-2: #eef1f5;
    --text: #1c2126;
    --text-dim: #667085;
    --border: #e2e6ea;
    --primary: #2f6fed;
    --primary-dim: #e8effe;
    --income: #14a06b;
    --income-bg: #e6f7ef;
    --expense: #e14b4b;
    --expense-bg: #fdecec;
    --shadow: 0 1px 3px rgba(20,20,30,0.06), 0 1px 2px rgba(20,20,30,0.08);
    --radius: 14px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Sarabun", "Noto Sans Thai", Roboto, Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14161a;
      --surface: #1d2025;
      --surface-2: #24282e;
      --text: #edeff2;
      --text-dim: #9aa3af;
      --border: #2c3138;
      --primary: #5b8cff;
      --primary-dim: #202a42;
      --income: #35c98a;
      --income-bg: #12332584;
      --expense: #ff6b6b;
      --expense-bg: #3a1d1d84;
      --shadow: 0 1px 3px rgba(0,0,0,0.4), 0 1px 2px rgba(0,0,0,0.5);
    }
  }
  :root[data-theme="dark"] {
    --bg: #14161a;
    --surface: #1d2025;
    --surface-2: #24282e;
    --text: #edeff2;
    --text-dim: #9aa3af;
    --border: #2c3138;
    --primary: #5b8cff;
    --primary-dim: #202a42;
    --income: #35c98a;
    --income-bg: #12332584;
    --expense: #ff6b6b;
    --expense-bg: #3a1d1d84;
    --shadow: 0 1px 3px rgba(0,0,0,0.4), 0 1px 2px rgba(0,0,0,0.5);
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background: var(--bg); color: var(--text); }
  body { min-height:100vh; }
  #app { max-width: 920px; margin: 0 auto; padding: 16px 16px 90px; }

  header.topbar {
    display:flex; align-items:center; justify-content:space-between;
    padding: 14px 4px 18px;
  }
  header.topbar .brand { display:flex; align-items:center; gap:10px; }
  header.topbar .brand .logo {
    width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--primary),#7aa6ff);
    display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;
  }
  header.topbar h1 { font-size:17px; margin:0; font-weight:700; }
  header.topbar .sub { font-size:12px; color:var(--text-dim); margin:0; }
  header.topbar .who { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--text-dim); }
  header.topbar .avatar { width:28px;height:28px;border-radius:50%; overflow:hidden; flex-shrink:0; border:1px solid var(--border);}
  header.topbar .avatar img { width:100%; height:100%; object-fit:cover; }

  nav.tabs {
    display:flex; gap:4px; background:var(--surface); border:1px solid var(--border);
    border-radius: 12px; padding:4px; margin-bottom:18px; overflow-x:auto;
  }
  nav.tabs button {
    flex:1; white-space:nowrap; border:none; background:transparent; color:var(--text-dim);
    padding:9px 10px; font-size:13px; font-weight:600; border-radius:9px; cursor:pointer;
    transition: background .15s, color .15s;
  }
  nav.tabs button.active { background: var(--primary); color:#fff; }

  .card {
    background:var(--surface); border:1px solid var(--border); border-radius: var(--radius);
    padding:16px; box-shadow: var(--shadow);
  }
  .grid3 { display:grid; grid-template-columns: repeat(3,1fr); gap:10px; margin-bottom:18px; }
  @media (max-width:520px){ .grid3{ grid-template-columns: 1fr 1fr; } .grid3 .card:first-child{ grid-column: 1/-1; } }

  .stat-label { font-size:12px; color:var(--text-dim); margin:0 0 6px; font-weight:600; }
  .stat-value { font-size:20px; font-weight:800; margin:0; letter-spacing:-0.3px; }
  .stat-value.income { color: var(--income); }
  .stat-value.expense { color: var(--expense); }

  section { margin-bottom: 22px; }
  h2.section-title { font-size:14px; font-weight:700; margin: 0 0 10px; color: var(--text-dim); text-transform:uppercase; letter-spacing:0.4px; }

  .row { display:flex; align-items:center; gap:12px; }
  .space-between { justify-content:space-between; }

  /* Add form */
  .type-switch { display:flex; gap:8px; margin-bottom:14px; }
  .type-switch button {
    flex:1; padding:11px; border-radius:10px; border:1.5px solid var(--border); background:var(--surface-2);
    font-weight:700; font-size:14px; cursor:pointer; color:var(--text-dim);
  }
  .type-switch button.sel-income.active { background:var(--income-bg); color:var(--income); border-color:var(--income); }
  .type-switch button.sel-expense.active { background:var(--expense-bg); color:var(--expense); border-color:var(--expense); }

  label.field { display:block; font-size:12px; font-weight:600; color:var(--text-dim); margin: 12px 0 6px; }
  input, select, textarea {
    width:100%; padding:11px 12px; border-radius:10px; border:1.5px solid var(--border);
    background:var(--surface); color:var(--text); font-size:15px; font-family: inherit;
  }
  input:focus, select:focus, textarea:focus { outline:none; border-color: var(--primary); }
  .amount-input { font-size:24px; font-weight:800; }

  .btn {
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    padding:12px 18px; border-radius:11px; border:none; font-weight:700; font-size:15px; cursor:pointer;
    width:100%; margin-top:16px;
  }
  .btn-primary { background: var(--primary); color:#fff; }
  .btn-primary:disabled { opacity:.5; cursor:not-allowed; }
  .btn-ghost { background:transparent; color: var(--text-dim); border:1.5px solid var(--border); }
  .btn-danger-text { color: var(--expense); background:none; border:none; font-size:13px; font-weight:600; cursor:pointer; padding:6px; }

  .chip-row { display:flex; flex-wrap:wrap; gap:8px; }
  .chip {
    padding:8px 12px; border-radius:20px; border:1.5px solid var(--border); background:var(--surface-2);
    font-size:13px; font-weight:600; cursor:pointer; color:var(--text-dim); user-select:none;
  }
  .chip.active { background:var(--primary-dim); border-color:var(--primary); color:var(--primary); }

  /* Transactions list */
  .filter-bar { display:flex; gap:8px; margin-bottom:14px; overflow-x:auto; }
  .filter-bar button {
    padding:8px 14px; border-radius:9px; border:1.5px solid var(--border); background:var(--surface);
    color:var(--text-dim); font-weight:600; font-size:13px; cursor:pointer; white-space:nowrap;
  }
  .filter-bar button.active { background:var(--primary); border-color:var(--primary); color:#fff; }
  .filter-bar select { width:auto; padding:8px 12px; font-size:13px; font-weight:600; }

  .day-group { margin-bottom:14px; }
  .day-group .day-label { font-size:12px; font-weight:700; color:var(--text-dim); margin: 0 0 8px 4px; display:flex; justify-content:space-between; }
  .tx-item {
    display:flex; align-items:center; gap:12px; padding:12px; background:var(--surface); border:1px solid var(--border);
    border-radius:12px; margin-bottom:8px; cursor:pointer;
  }
  .tx-icon { width:38px;height:38px;border-radius:10px; display:flex;align-items:center;justify-content:center; font-size:18px; flex-shrink:0; }
  .tx-icon.income { background:var(--income-bg); }
  .tx-icon.expense { background:var(--expense-bg); }
  .tx-main { flex:1; min-width:0; }
  .tx-cat { font-weight:700; font-size:14px; margin:0; }
  .tx-note { font-size:12px; color:var(--text-dim); margin:2px 0 0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tx-amount { font-weight:800; font-size:15px; white-space:nowrap; }
  .tx-amount.income { color:var(--income); }
  .tx-amount.expense { color:var(--expense); }
  .empty-state { text-align:center; padding:50px 20px; color:var(--text-dim); }
  .empty-state .big { font-size:40px; margin-bottom:10px; }

  /* Stats */
  .period-switch { display:flex; gap:6px; margin-bottom:16px; }
  .period-switch button { flex:1; padding:9px; border-radius:9px; border:1.5px solid var(--border); background:var(--surface); color:var(--text-dim); font-weight:700; font-size:13px; cursor:pointer; }
  .period-switch button.active { background:var(--primary); border-color:var(--primary); color:#fff; }
  .nav-period { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .nav-period button { background:var(--surface-2); border:1px solid var(--border); border-radius:8px; width:32px; height:32px; cursor:pointer; color:var(--text); font-size:15px; }
  .nav-period .label { font-weight:700; font-size:14px; }
  .cat-bar-row { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .cat-bar-row .cat-name { font-size:12px; width:88px; flex-shrink:0; color:var(--text-dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .cat-bar-track { flex:1; background:var(--surface-2); border-radius:6px; height:10px; overflow:hidden; }
  .cat-bar-fill { height:100%; border-radius:6px; }
  .cat-bar-amt { font-size:12px; font-weight:700; width:76px; text-align:right; flex-shrink:0; }

  /* modal */
  .overlay {
    position:fixed; inset:0; background:rgba(0,0,0,0.45); display:flex; align-items:flex-end; justify-content:center;
    z-index:50;
  }
  @media (min-width:600px){ .overlay{ align-items:center; } }
  .sheet {
    background:var(--surface); width:100%; max-width:480px; border-radius: 18px 18px 0 0; padding:20px; max-height:90vh; overflow-y:auto;
  }
  @media (min-width:600px){ .sheet{ border-radius:18px; } }
  .sheet-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
  .sheet-head h3 { margin:0; font-size:16px; }
  .close-x { background:none;border:none;font-size:20px;color:var(--text-dim);cursor:pointer; padding:4px; }

  .toast {
    position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:var(--text); color:var(--bg);
    padding:10px 18px; border-radius:10px; font-size:13px; font-weight:600; z-index:100; opacity:0; transition:opacity .2s;
    pointer-events:none;
  }
  .toast.show { opacity:1; }

  .banner {
    background: var(--primary-dim); border:1px solid var(--primary); color:var(--text); border-radius:12px; padding:10px 14px;
    font-size:12.5px; margin-bottom:16px; display:flex; gap:8px; align-items:flex-start;
  }
  svg text { fill: var(--text-dim); font-size: 10px; font-family: inherit; }

  .icon-btn {
    width:34px; height:34px; border-radius:9px; border:1px solid var(--border); background:var(--surface);
    color:var(--text); font-size:15px; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .header-actions { display:flex; align-items:center; gap:8px; }

  .budget-track { background:var(--surface-2); border-radius:8px; height:14px; overflow:hidden; position:relative; }
  .budget-fill { height:100%; border-radius:8px; transition:width .2s; }
  .budget-fill.ok { background: var(--income); }
  .budget-fill.warn { background: #f2a93b; }
  .budget-fill.over { background: var(--expense); }
  .budget-row-label { display:flex; justify-content:space-between; font-size:12px; margin-bottom:6px; color:var(--text-dim); }
  .budget-item { margin-bottom:14px; }
  .budget-item:last-child { margin-bottom:0; }
  .link-btn { background:none; border:none; color:var(--primary); font-weight:700; font-size:13px; cursor:pointer; padding:6px 0; }
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <div class="logo">💰</div>
      <div>
        <h1>บัญชีรายรับ-รายจ่าย</h1>
        <p class="sub" id="greeting">สำหรับครอบครัวและธุรกิจของคุณ</p>
      </div>
    </div>
    <div class="header-actions">
      <div class="who" id="whoBox"></div>
      <button class="icon-btn" id="btnBudgetSettings" title="ตั้งงบประมาณ">🎯</button>
      <button class="icon-btn" id="btnExport" title="ส่งออกเป็น CSV">⬇️</button>
    </div>
  </header>

  <div id="storageBanner"></div>

  <nav class="tabs">
    <button data-tab="dashboard" class="active">ภาพรวม</button>
    <button data-tab="add">เพิ่มรายการ</button>
    <button data-tab="list">รายการ</button>
    <button data-tab="stats">สถิติ</button>
  </nav>

  <div id="view-dashboard"></div>
  <div id="view-add" style="display:none;"></div>
  <div id="view-list" style="display:none;"></div>
  <div id="view-stats" style="display:none;"></div>
</div>

<div id="modalRoot"></div>
<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  /* ---------------- constants ---------------- */
  var CATS = {
    income: [
      {k:"เงินเดือน", i:"💼"}, {k:"โบนัส", i:"🎁"}, {k:"รายได้เสริม", i:"🛠️"},
      {k:"ขายของ", i:"🏷️"}, {k:"เงินลงทุน", i:"📈"}, {k:"อื่นๆ", i:"➕"}
    ],
    expense: [
      {k:"อาหาร", i:"🍜"}, {k:"เดินทาง", i:"🚗"}, {k:"ที่พัก/บ้าน", i:"🏠"},
      {k:"สาธารณูปโภค", i:"💡"}, {k:"ช้อปปิ้ง", i:"🛍️"}, {k:"บันเทิง", i:"🎬"},
      {k:"สุขภาพ", i:"💊"}, {k:"การศึกษา", i:"📚"}, {k:"อื่นๆ", i:"➖"}
    ]
  };
  var CAT_COLORS = ["#2f6fed","#14a06b","#e14b4b","#f2a93b","#9b59d0","#17a2b8","#e67e22","#6c5ce7","#00b894","#d63384"];
  var MONTHS_TH = ["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
  var DAYS_TH = ["อา","จ","อ","พ","พฤ","ศ","ส"];

  function fmt(n){
    n = Number(n)||0;
    return n.toLocaleString('th-TH', {minimumFractionDigits:0, maximumFractionDigits:2});
  }
  function todayISO(){
    var d = new Date();
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  }
  function uid(){ return 'tx_' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
  function toast(msg){
    var t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toast._h);
    toast._h = setTimeout(function(){ t.classList.remove('show'); }, 1800);
  }

  /* ---------------- storage layer ---------------- */
  // Uses claude db capability (per-user private cloud storage) when available,
  // falls back to localStorage so the app still works standalone.
  var Store = {
    mode: 'local', // 'cloud' | 'local'
    db: null,
    userNs: null, // db.collection path prefix for this user
    localKey: 'budget_tx_v1',
    listeners: [],
    _unsub: null,

    async init(){
      try {
        if (window.claude && typeof window.claude.use === 'function') {
          var db = await window.claude.use('db');
          var user = await window.claude.use('user');
          if (db) {
            var myId = null;
            if (user) { try { myId = await user.id(); } catch(e){ myId = null; } }
            if (myId) {
              this.db = db;
              this.userId = myId;
              this.mode = 'cloud';
              this.user = user;
              return true;
            }
          }
        }
      } catch(e) { /* fall through to local */ }
      this.mode = 'local';
      return false;
    },

    col(){
      return this.db.collection('data/users/' + this.userId + '/transactions');
    },

    _localAll(){
      try {
        var raw = localStorage.getItem(this.localKey);
        return raw ? JSON.parse(raw) : [];
      } catch(e){ return []; }
    },
    _localSave(list){
      try { localStorage.setItem(this.localKey, JSON.stringify(list)); } catch(e){}
    },

    subscribe(cb){
      this.listeners.push(cb);
      if (this.mode === 'cloud') {
        if (!this._unsub) {
          var self = this;
          this._unsub = this.col().orderBy('date','desc').limit(2000).onSnapshot(function(snap){
            self._cache = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
            self.listeners.forEach(function(l){ l(self._cache); });
          }, function(err){
            console.error('db error', err);
            toast('เกิดข้อผิดพลาดในการซิงค์ข้อมูล');
          });
        } else if (this._cache) {
          cb(this._cache);
        }
      } else {
        var list = this._localAll();
        this._cache = list;
        cb(list);
      }
    },

    async add(tx){
      tx = Object.assign({}, tx, { createdAt: Date.now() });
      if (this.mode === 'cloud') {
        await this.col().doc(uid()).set(tx);
      } else {
        var list = this._localAll();
        tx.id = uid();
        list.push(tx);
        this._localSave(list);
        this._cache = list;
        this.listeners.forEach(function(l){ l(list); });
      }
    },
    async update(id, patch){
      if (this.mode === 'cloud') {
        await this.col().doc(id).update(patch);
      } else {
        var list = this._localAll();
        for (var i=0;i<list.length;i++){ if (list[i].id===id) list[i] = Object.assign({}, list[i], patch); }
        this._localSave(list);
        this._cache = list;
        this.listeners.forEach(function(l){ l(list); });
      }
    },
    async remove(id){
      if (this.mode === 'cloud') {
        await this.col().doc(id).delete();
      } else {
        var list = this._localAll().filter(function(t){ return t.id!==id; });
        this._localSave(list);
        this._cache = list;
        this.listeners.forEach(function(l){ l(list); });
      }
    },

    /* ---- budget settings ---- */
    budgetLocalKey: 'budget_settings_v1',
    async getBudget(){
      if (this.mode === 'cloud') {
        try {
          var snap = await this.db.doc('data/users/' + this.userId + '/settings/budget').get();
          return snap.exists ? snap.data() : { overall: 0, categories: {} };
        } catch(e){ return { overall:0, categories:{} }; }
      } else {
        try {
          var raw = localStorage.getItem(this.budgetLocalKey);
          return raw ? JSON.parse(raw) : { overall:0, categories:{} };
        } catch(e){ return { overall:0, categories:{} }; }
      }
    },
    async setBudget(data){
      if (this.mode === 'cloud') {
        await this.db.doc('data/users/' + this.userId + '/settings/budget').set(data);
      } else {
        localStorage.setItem(this.budgetLocalKey, JSON.stringify(data));
      }
    },

    async initDownloads(){
      try {
        if (window.claude && typeof window.claude.use === 'function') {
          this.downloads = await window.claude.use('downloads');
        }
      } catch(e){ this.downloads = null; }
    }
  };

  /* ---------------- app state ---------------- */
  var STATE = {
    tab: 'dashboard',
    tx: [],
    addType: 'expense',
    addCat: null,
    editId: null,
    listFilter: 'month', // day|month|year|all
    statsPeriod: 'month', // day|month|year
    statsAnchor: new Date(),
    budget: { overall: 0, categories: {} },
  };

  function allTx(){ return STATE.tx || []; }

  function onData(list){
    STATE.tx = list.slice().sort(function(a,b){
      if (a.date === b.date) return (b.createdAt||0)-(a.createdAt||0);
      return a.date < b.date ? 1 : -1;
    });
    render();
  }

  /* ---------------- header / who ---------------- */
  async function renderWho(){
    var box = document.getElementById('whoBox');
    var greet = document.getElementById('greeting');
    if (Store.mode === 'cloud' && Store.user) {
      try {
        var me = await Store.user.me();
        box.innerHTML = '<span>'+ (me.name ? escapeHtml(me.name) : 'สวัสดี') +'</span><span class="avatar"><img src="'+me.avatarUrl+'"></span>';
        greet.textContent = (me.name ? me.name + ' • ' : '') + 'ข้อมูลถูกบันทึกไว้ในบัญชีของคุณ';
      } catch(e){}
    } else {
      box.innerHTML = '<span>โหมดออฟไลน์</span>';
    }
  }

  function renderBanner(){
    var el = document.getElementById('storageBanner');
    if (Store.mode === 'local') {
      el.innerHTML = '<div class="banner">⚠️ <div>ขณะนี้บันทึกข้อมูลไว้บนเบราว์เซอร์นี้เท่านั้น (ยังไม่เชื่อมบัญชีผู้ใช้) หากเปลี่ยนอุปกรณ์ข้อมูลจะไม่ติดตามไปด้วย</div></div>';
    } else {
      el.innerHTML = '';
    }
  }

  function escapeHtml(s){
    return String(s||'').replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  /* ---------------- tabs ---------------- */
  document.querySelectorAll('nav.tabs button').forEach(function(btn){
    btn.addEventListener('click', function(){
      STATE.tab = btn.getAttribute('data-tab');
      document.querySelectorAll('nav.tabs button').forEach(function(b){ b.classList.toggle('active', b===btn); });
      ['dashboard','add','list','stats'].forEach(function(t){

  /* ---------------- aggregation helpers ---------------- */
  function ymd(dateStr){ return dateStr.split('-'); } // [Y,M,D]
  function sumBy(list, pred){
    var inc=0, exp=0;
    list.forEach(function(t){
      if (!pred || pred(t)) {
        if (t.type==='income') inc += Number(t.amount)||0; else exp += Number(t.amount)||0;
      }
    });
    return {income:inc, expense:exp, balance: inc-exp};
  }
  function monthKey(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }

  /* ---------------- DASHBOARD ---------------- */

    html += '<div class="grid3">';
    html += '<div class="card"><p class="stat-label">คงเหลือสุทธิ</p><p class="stat-value" style="color:'+(mSum.balance>=0?'var(--income)':'var(--expense)')+'">฿'+fmt(mSum.balance)+'</p></div>';
    html += '<div class="card"><p class="stat-label">รายรับ</p><p class="stat-value income">฿'+fmt(mSum.income)+'</p></div>';
    html += '<div class="card"><p class="stat-label">รายจ่าย</p><p class="stat-value expense">฿'+fmt(mSum.expense)+'</p></div>';

    if (budgetHtml) html += '<section><h2 class="section-title">งบประมาณเดือนนี้</h2><div class="card">'+budgetHtml+'</div></section>';

    html += '<div class="card"><p class="stat-label">ปีนี้ ('+(now.getFullYear()+543)+')</p><p class="stat-value" style="color:'+(ySum.balance>=0?'var(--income)':'var(--expense)')+'">฿'+fmt(ySum.balance)+'</p><p class="sub" style="font-size:11px;color:var(--text-dim);margin:4px 0 0;">รับ ฿'+fmt(ySum.income)+' · จ่าย ฿'+fmt(ySum.expense)+'</p></div>';
    html += '</div></section>';

    // last 7 days mini chart
    html += '<section><h2 class="section-title">7 วันล่าสุด</h2><div class="card">'+ renderLast7Chart() +'</div></section>';

    // recent transactions
    var recent = allTx().slice(0,5);
    html += '<section><div class="row space-between"><h2 class="section-title" style="margin-bottom:0;">รายการล่าสุด</h2><span style="font-size:12px;color:var(--primary);font-weight:700;cursor:pointer;" id="seeAllLink">ดูทั้งหมด →</span></div>';
    if (recent.length===0) {

  function renderLast7Chart(){
    var days = [];
    for (var i=6;i>=0;i--){
      var d = new Date();
      d.setDate(d.getDate()-i);
      var key = d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
      var s = sumBy(allTx().filter(function(t){return t.date===key;}));
      days.push({label: DAYS_TH[d.getDay()], date:d.getDate(), income:s.income, expense:s.expense});
    }
    var max = Math.max(1, Math.max.apply(null, days.map(function(d){return Math.max(d.income,d.expense);})));
    var w=280, h=120, barW= (w/7)*0.6, gap=(w/7);
    var bars = days.map(function(d,i){
      var x = i*gap + (gap-barW)/2;
      var hi = (d.income/max)*(h-24);
      var he = (d.expense/max)*(h-24);
      var s = '';
      s += '<rect x="'+x+'" y="'+(h-24-hi)+'" width="'+(barW/2-1)+'" height="'+hi+'" fill="var(--income)" rx="2"/>';
      s += '<rect x="'+(x+barW/2+1)+'" y="'+(h-24-he)+'" width="'+(barW/2-1)+'" height="'+he+'" fill="var(--expense)" rx="2"/>';
      s += '<text x="'+(x+barW/2)+'" y="'+(h-8)+'" text-anchor="middle">'+d.label+'</text>';
      return s;
    }).join('');
    return '<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;height:110px;" preserveAspectRatio="xMidYMid meet">'+bars+'</svg>'+
      '<div style="display:flex;gap:14px;justify-content:center;font-size:11px;color:var(--text-dim);margin-top:4px;">'+
      '<span>🟢 รายรับ</span><span>🔴 รายจ่าย</span></div>';
  }

  /* ---------------- BUDGET ---------------- */
  function budgetBarClass(pct){
    if (pct >= 100) return 'over';
    if (pct >= 80) return 'warn';
    return 'ok';
  }

  function renderBudgetSection(monthTx){
    var b = STATE.budget || {overall:0, categories:{}};
    var hasOverall = b.overall && b.overall > 0;
    var catBudgets = Object.keys(b.categories||{}).filter(function(k){ return b.categories[k] > 0; });
    if (!hasOverall && catBudgets.length===0) {
      return '<p style="font-size:13px;color:var(--text-dim);margin:0 0 8px;">ยังไม่ได้ตั้งงบประมาณ</p><button class="link-btn budgetSetLink">+ ตั้งงบประมาณเดือนนี้</button>';
    }
    var expByCat = {};
    var totalExp = 0;
    monthTx.forEach(function(t){
      if (t.type!=='expense') return;
      expByCat[t.category] = (expByCat[t.category]||0) + Number(t.amount||0);
      totalExp += Number(t.amount||0);
    });
    var html = '';
    if (hasOverall) {
      var pct = Math.min(100, (totalExp/b.overall)*100);
      html += '<div class="budget-item"><div class="budget-row-label"><span>งบรวม</span><span>฿'+fmt(totalExp)+' / ฿'+fmt(b.overall)+'</span></div>' +
        '<div class="budget-track"><div class="budget-fill '+budgetBarClass(pct)+'" style="width:'+pct+'%;"></div></div></div>';
    }
    catBudgets.forEach(function(cat){
      var spent = expByCat[cat] || 0;
      var lim = b.categories[cat];
      var pct = Math.min(100, (spent/lim)*100);
      html += '<div class="budget-item"><div class="budget-row-label"><span>'+escapeHtml(cat)+'</span><span>฿'+fmt(spent)+' / ฿'+fmt(lim)+'</span></div>' +
        '<div class="budget-track"><div class="budget-fill '+budgetBarClass(pct)+'" style="width:'+pct+'%;"></div></div></div>';
    });
    html += '<button class="link-btn budgetSetLink">แก้ไขงบประมาณ</button>';
    return html;
  }

  /* ---------------- EXPORT ---------------- */
  function csvEscape(v){
    v = String(v==null?'':v);
    if (/[",\n]/.test(v)) return '"' + v.replace(/"/g,'""') + '"';
    return v;
  }
  function buildCsv(list){
    var rows = [['วันที่','ประเภท','หมวดหมู่','จำนวนเงิน','บันทึก']];
    list.slice().sort(function(a,b){ return a.date<b.date?-1:1; }).forEach(function(t){
      rows.push([t.date, t.type==='income'?'รายรับ':'รายจ่าย', t.category, t.amount, t.note||'']);
    });
    return '\uFEFF' + rows.map(function(r){ return r.map(csvEscape).join(','); }).join('\r\n');
  }
  async function exportCsv(){
    var list = allTx();
    if (list.length===0) { toast('ไม่มีข้อมูลให้ส่งออก'); return; }
    var csv = buildCsv(list);
    var fname = 'บัญชีรายรับรายจ่าย_' + todayISO() + '.csv';
    if (Store.downloads) {
      try {
        await Store.downloads.save({ filename: fname, data: csv });
        toast('ส่งออกไฟล์เรียบร้อย');
      } catch(e){
        if (e && e.code === 'declined') return;
        console.error(e);
        toast('ไม่สามารถส่งออกไฟล์ได้ในขณะนี้');
      }
    } else {
      try {
        var blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url; a.download = fname;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        URL.revokeObjectURL(url);
        toast('ส่งออกไฟล์เรียบร้อย');
      } catch(e){ console.error(e); toast('ไม่สามารถส่งออกไฟล์ได้'); }
    }
  }

  /* ---------------- LIST ---------------- */
  function filteredForList(){
    var now = new Date();
    var list = allTx();
    if (STATE.listFilter==='day') {
      var t = todayISO();
      list = list.filter(function(x){ return x.date===t; });
    } else if (STATE.listFilter==='month') {
      var mk = monthKey(now);
      list = list.filter(function(x){ return x.date && x.date.slice(0,7)===mk; });
    } else if (STATE.listFilter==='year') {
      var yk = String(now.getFullYear());
      list = list.filter(function(x){ return x.date && x.date.slice(0,4)===yk; });
    }
    return list;
  }

  function renderListView(){
    var el = document.getElementById('view-list');
    var list = filteredForList();
    var sum = sumBy(list);

    var html = '<div class="filter-bar">';
    [['day','วันนี้'],['month','เดือนนี้'],['year','ปีนี้'],['all','ทั้งหมด']].forEach(function(p){
      html += '<button data-f="'+p[0]+'" class="'+(STATE.listFilter===p[0]?'active':'')+'">'+p[1]+'</button>';
    });
    html += '</div>';

    html += '<div class="card" style="margin-bottom:14px;"><div class="row space-between">'+
      '<div><p class="stat-label">รายรับ</p><p class="stat-value income">฿'+fmt(sum.income)+'</p></div>'+
      '<div><p class="stat-label">รายจ่าย</p><p class="stat-value expense">฿'+fmt(sum.expense)+'</p></div>'+
      '<div><p class="stat-label">คงเหลือ</p><p class="stat-value" style="color:'+(sum.balance>=0?'var(--income)':'var(--expense)')+'">฿'+fmt(sum.balance)+'</p></div>'+
      '</div></div>';

    if (list.length===0) {
      html += '<div class="card empty-state"><div class="big">📭</div>ไม่มีรายการในช่วงนี้</div>';
    } else {
      // group by date
      var groups = {};
      var order = [];
      list.forEach(function(t){
        if (!groups[t.date]) { groups[t.date]=[]; order.push(t.date); }
        groups[t.date].push(t);
      });
      html += order.map(function(date){
        var items = groups[date];
        var s = sumBy(items);
        var d = new Date(date+"T00:00:00");
        var label = isNaN(d) ? date : (d.getDate()+' '+MONTHS_TH[d.getMonth()]+' '+(d.getFullYear()+543));
        return '<div class="day-group"><div class="day-label"><span>'+label+'</span><span>'+(s.balance>=0?'+':'')+fmt(s.balance)+'</span></div>' +
          items.map(renderTxItem).join('') + '</div>';
      }).join('');
    }

    el.innerHTML = html;
    el.querySelectorAll('[data-f]').forEach(function(b){
      b.addEventListener('click', function(){
        STATE.listFilter = b.getAttribute('data-f');
        renderListView();
      });
    });
    bindTxItemClicks(el);
  }

      try {
        await Store.remove(t.id);
        toast('ลบรายการแล้ว');
        closeModal();
      } catch(e){ console.error(e); toast('เกิดข้อผิดพลาด'); }
    });
  }
  function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }

  /* ---------------- STATS ---------------- */
  function renderStatsView(){
    var el = document.getElementById('view-stats');
    var html = '<div class="period-switch">';
    [['day','รายวัน'],['month','รายเดือน'],['year','รายปี']].forEach(function(p){
      html += '<button data-p="'+p[0]+'" class="'+(STATE.statsPeriod===p[0]?'active':'')+'">'+p[1]+'</button>';
    });
    html += '</div>';
    html += '<div id="statsBody"></div>';
    el.innerHTML = html;
    el.querySelectorAll('[data-p]').forEach(function(b){
      b.addEventListener('click', function(){
        STATE.statsPeriod = b.getAttribute('data-p');
        STATE.statsAnchor = new Date();
        renderStatsView();
      });
    });
    var body = document.getElementById('statsBody');
    if (STATE.statsPeriod==='day') renderDayStats(body);
    else if (STATE.statsPeriod==='month') renderMonthStats(body);
    else renderYearStats(body);
  }

  function navHeader(label, onPrev, onNext){
    return '<div class="nav-period"><button id="navPrev">‹</button><span class="label">'+label+'</span><button id="navNext">›</button></div>';
  }
  function bindNav(container, onPrev, onNext){
    container.querySelector('#navPrev').addEventListener('click', onPrev);
    container.querySelector('#navNext').addEventListener('click', onNext);
  }

  function categoryBreakdownHtml(list){
    var byCat = {};
    list.forEach(function(t){
      if (t.type!=='expense') return;
      byCat[t.category] = (byCat[t.category]||0) + Number(t.amount||0);
    });
    var entries = Object.keys(byCat).map(function(k){return {cat:k, amt:byCat[k]};}).sort(function(a,b){return b.amt-a.amt;});
    if (entries.length===0) return '<p style="color:var(--text-dim);font-size:13px;text-align:center;padding:12px 0;">ยังไม่มีรายจ่ายในช่วงนี้</p>';
    var max = entries[0].amt || 1;
    return entries.map(function(e,i){
      var pct = (e.amt/max)*100;
      var color = CAT_COLORS[i % CAT_COLORS.length];
      return '<div class="cat-bar-row"><span class="cat-name">'+escapeHtml(e.cat)+'</span>'+
        '<div class="cat-bar-track"><div class="cat-bar-fill" style="width:'+pct+'%;background:'+color+';"></div></div>'+
        '<span class="cat-bar-amt">฿'+fmt(e.amt)+'</span></div>';
    }).join('');
  }

  function renderDayStats(body){
    var d = STATE.statsAnchor;
    var key = d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    var label = d.getDate()+' '+MONTHS_TH[d.getMonth()]+' '+(d.getFullYear()+543);
    var list = allTx().filter(function(t){ return t.date===key; });
    var s = sumBy(list);

    var html = navHeader(label);
    html += '<div class="grid3" style="grid-template-columns:1fr 1fr 1fr;margin-bottom:16px;">';
    html += '<div class="card"><p class="stat-label">รายรับ</p><p class="stat-value income">฿'+fmt(s.income)+'</p></div>';
    html += '<div class="card"><p class="stat-label">รายจ่าย</p><p class="stat-value expense">฿'+fmt(s.expense)+'</p></div>';
    html += '<div class="card"><p class="stat-label">คงเหลือ</p><p class="stat-value" style="color:'+(s.balance>=0?'var(--income)':'var(--expense)')+'">฿'+fmt(s.balance)+'</p></div>';
    html += '</div>';
    html += '<div class="card"><h2 class="section-title">สัดส่วนรายจ่ายตามหมวดหมู่</h2>'+categoryBreakdownHtml(list)+'</div>';
    html += '<div class="card" style="margin-top:14px;"><h2 class="section-title">รายการของวันนี้</h2>'+
      (list.length ? list.map(renderTxItem).join('') : '<p style="color:var(--text-dim);font-size:13px;text-align:center;">ไม่มีรายการ</p>')+'</div>';
    body.innerHTML = html;
    bindNav(body, function(){ STATE.statsAnchor = new Date(d.getTime()-86400000); renderStatsView(); },
                  function(){ STATE.statsAnchor = new Date(d.getTime()+86400000); renderStatsView(); });
    bindTxItemClicks(body);
  }

  function renderMonthStats(body){
    var d = STATE.statsAnchor;
    var y = d.getFullYear(), m = d.getMonth();
    var label = MONTHS_TH[m]+' '+(y+543);
    var mk = y+"-"+String(m+1).padStart(2,"0");
    var list = allTx().filter(function(t){ return t.date && t.date.slice(0,7)===mk; });
    var s = sumBy(list);

    var daysInMonth = new Date(y, m+1, 0).getDate();
    var dayData = [];
    for (var i=1;i<=daysInMonth;i++){
      var dk = mk+"-"+String(i).padStart(2,"0");
      var ds = sumBy(list.filter(function(t){return t.date===dk;}));
      dayData.push(ds);
    }
    var max = Math.max(1, Math.max.apply(null, dayData.map(function(x){return Math.max(x.income,x.expense);})));
    var w=Math.max(320, daysInMonth*14), h=140, gap = w/daysInMonth, barW = gap*0.6;
    var bars = dayData.map(function(x,i){
      var xx = i*gap+(gap-barW)/2;
      var hi = (x.income/max)*(h-26), he=(x.expense/max)*(h-26);
      var s2='';
      s2 += '<rect x="'+xx+'" y="'+(h-26-hi)+'" width="'+(barW/2-1)+'" height="'+hi+'" fill="var(--income)" rx="1.5"/>';
      s2 += '<rect x="'+(xx+barW/2+1)+'" y="'+(h-26-he)+'" width="'+(barW/2-1)+'" height="'+he+'" fill="var(--expense)" rx="1.5"/>';
      if ((i+1)%5===0 || i===0) s2 += '<text x="'+(xx+barW/2)+'" y="'+(h-10)+'" text-anchor="middle">'+(i+1)+'</text>';
      return s2;
    }).join('');

    var html = navHeader(label);
    html += '<div class="grid3" style="grid-template-columns:1fr 1fr 1fr;margin-bottom:16px;">';
    html += '<div class="card"><p class="stat-label">รายรับ</p><p class="stat-value income">฿'+fmt(s.income)+'</p></div>';
    html += '<div class="card"><p class="stat-label">รายจ่าย</p><p class="stat-value expense">฿'+fmt(s.expense)+'</p></div>';
    html += '<div class="card"><p class="stat-label">คงเหลือ</p><p class="stat-value" style="color:'+(s.balance>=0?'var(--income)':'var(--expense)')+'">฿'+fmt(s.balance)+'</p></div>';
    html += '</div>';
    html += '<div class="card" style="margin-bottom:14px;overflow-x:auto;"><h2 class="section-title">รายวันตลอดเดือน</h2>'+
      '<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;min-width:'+w+'px;height:130px;">'+bars+'</svg></div>';
    var budgetHtml2 = renderBudgetSection(list);
    if (budgetHtml2) html += '<div class="card" style="margin-bottom:14px;"><h2 class="section-title">งบประมาณ</h2>'+budgetHtml2+'</div>';
    html += '<div class="card"><h2 class="section-title">สัดส่วนรายจ่ายตามหมวดหมู่</h2>'+categoryBreakdownHtml(list)+'</div>';
    body.innerHTML = html;
    bindNav(body,
      function(){ STATE.statsAnchor = new Date(y, m-1, 1); renderStatsView(); },
      function(){ STATE.statsAnchor = new Date(y, m+1, 1); renderStatsView(); });
    body.querySelectorAll('.budgetSetLink').forEach(function(b){ b.addEventListener('click', openBudgetModal); });
  }

  function renderYearStats(body){
    var d = STATE.statsAnchor;
    var y = d.getFullYear();
    var label = (y+543);
    var list = allTx().filter(function(t){ return t.date && t.date.slice(0,4)===String(y); });
    var s = sumBy(list);

    var monthData = [];
    for (var i=0;i<12;i++){
      var mk = y+"-"+String(i+1).padStart(2,"0");
      monthData.push(sumBy(list.filter(function(t){return t.date && t.date.slice(0,7)===mk;})));
    }
    var max = Math.max(1, Math.max.apply(null, monthData.map(function(x){return Math.max(x.income,x.expense);})));
    var w=340, h=150, gap=w/12, barW=gap*0.6;
    var bars = monthData.map(function(x,i){
      var xx = i*gap+(gap-barW)/2;
      var hi=(x.income/max)*(h-24), he=(x.expense/max)*(h-24);
      var s2='';
      s2 += '<rect x="'+xx+'" y="'+(h-24-hi)+'" width="'+(barW/2-1)+'" height="'+hi+'" fill="var(--income)" rx="2"/>';
      s2 += '<rect x="'+(xx+barW/2+1)+'" y="'+(h-24-he)+'" width="'+(barW/2-1)+'" height="'+he+'" fill="var(--expense)" rx="2"/>';
      s2 += '<text x="'+(xx+barW/2)+'" y="'+(h-8)+'" text-anchor="middle">'+MONTHS_TH[i]+'</text>';
      return s2;
    }).join('');

    var html = navHeader(label);
    html += '<div class="grid3" style="grid-template-columns:1fr 1fr 1fr;margin-bottom:16px;">';
    html += '<div class="card"><p class="stat-label">รายรับ</p><p class="stat-value income">฿'+fmt(s.income)+'</p></div>';
    html += '<div class="card"><p class="stat-label">รายจ่าย</p><p class="stat-value expense">฿'+fmt(s.expense)+'</p></div>';
    html += '<div class="card"><p class="stat-label">คงเหลือ</p><p class="stat-value" style="color:'+(s.balance>=0?'var(--income)':'var(--expense)')+'">฿'+fmt(s.balance)+'</p></div>';
    html += '</div>';
    html += '<div class="card" style="margin-bottom:14px;"><h2 class="section-title">รายเดือนตลอดปี</h2>'+
      '<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;height:140px;">'+bars+'</svg></div>';
    html += '<div class="card"><h2 class="section-title">สัดส่วนรายจ่ายตามหมวดหมู่</h2>'+categoryBreakdownHtml(list)+'</div>';
    body.innerHTML = html;
    bindNav(body,
      function(){ STATE.statsAnchor = new Date(y-1, d.getMonth(), 1); renderStatsView(); },
      function(){ STATE.statsAnchor = new Date(y+1, d.getMonth(), 1); renderStatsView(); });
  }

  /* ---------------- master render ---------------- */
  function render(){
    if (STATE.tab==='dashboard') renderDashboard();
    else if (STATE.tab==='add') renderAddView();
    else if (STATE.tab==='list') renderListView();
    else if (STATE.tab==='stats') renderStatsView();
  }

  /* ---------------- boot ---------------- */
  document.getElementById('btnBudgetSettings').addEventListener('click', openBudgetModal);
  document.getElementById('btnExport').addEventListener('click', exportCsv);

  (async function boot(){
    await Store.init();
    await Store.initDownloads();
    renderBanner();
    renderWho();
    try { STATE.budget = await Store.getBudget(); } catch(e){}
    Store.subscribe(onData);
    render();
  })();

})();
</script>
</body>
</html>
