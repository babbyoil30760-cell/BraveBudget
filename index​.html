<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>บัญชีรายรับ-รายจ่าย</title>
<style>
  :root {
    --bg: #f4f6f8;
    --surface: #ffffff;
    --surface-2: #eef1f5;
    --text: #1c2126;
    --text-dim: #667085;
    --border: #e2e6ea;
    --primary: #2f6fed;
    --primary-dim: #e8effe;
    --income: #14a06b;
    --income-bg: #e6f7ef;
    --expense: #e14b4b;
    --expense-bg: #fdecec;
    --other: #a6791b;
    --other-bg: #fdf3da;
    --shadow: 0 1px 3px rgba(20,20,30,0.06), 0 1px 2px rgba(20,20,30,0.08);
    --radius: 14px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Sarabun", "Noto Sans Thai", Roboto, Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14161a;
      --surface: #1d2025;
      --surface-2: #24282e;
      --text: #edeff2;
      --text-dim: #9aa3af;
      --border: #2c3138;
      --primary: #5b8cff;
      --primary-dim: #202a42;
      --income: #35c98a;
      --income-bg: #12332584;
      --expense: #ff6b6b;
      --expense-bg: #3a1d1d84;
      --other: #d9b24f;
      --other-bg: #33290f84;
      --shadow: 0 1px 3px rgba(0,0,0,0.4), 0 1px 2px rgba(0,0,0,0.5);
    }
  }
  :root[data-theme="dark"] {
    --bg: #14161a;
    --surface: #1d2025;
    --surface-2: #24282e;
    --text: #edeff2;
    --text-dim: #9aa3af;
    --border: #2c3138;
    --primary: #5b8cff;
    --primary-dim: #202a42;
    --income: #35c98a;
    --income-bg: #12332584;
    --expense: #ff6b6b;
    --expense-bg: #3a1d1d84;
    --other: #d9b24f;
    --other-bg: #33290f84;
    --shadow: 0 1px 3px rgba(0,0,0,0.4), 0 1px 2px rgba(0,0,0,0.5);
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background: var(--bg); color: var(--text); }
  body { min-height:100vh; }
  #app { max-width: 920px; margin: 0 auto; padding: 16px 16px 90px; }

  header.topbar {
    display:flex; align-items:center; justify-content:space-between;
    padding: 14px 4px 18px;
  }
  header.topbar .brand { display:flex; align-items:center; gap:10px; }
  header.topbar .brand .logo {
    width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--primary),#7aa6ff);
    display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;
  }
  header.topbar h1 { font-size:17px; margin:0; font-weight:700; }
  header.topbar .sub { font-size:12px; color:var(--text-dim); margin:0; }
  header.topbar .who { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--text-dim); }
  header.topbar .avatar { width:28px;height:28px;border-radius:50%; overflow:hidden; flex-shrink:0; border:1px solid var(--border);}
  header.topbar .avatar img { width:100%; height:100%; object-fit:cover; }

  nav.tabs {
    display:flex; gap:4px; background:var(--surface); border:1px solid var(--border);
    border-radius: 12px; padding:4px; margin-bottom:18px; overflow-x:auto;
  }
  nav.tabs button {
    flex:1; white-space:nowrap; border:none; background:transparent; color:var(--text-dim);
    padding:9px 10px; font-size:13px; font-weight:600; border-radius:9px; cursor:pointer;
    transition: background .15s, color .15s;
  }
  nav.tabs button.active { background: var(--primary); color:#fff; }

  .card {
    background:var(--surface); border:1px solid var(--border); border-radius: var(--radius);
    padding:16px; box-shadow: var(--shadow);
  }
  .grid3 { display:grid; grid-template-columns: repeat(3,1fr); gap:10px; margin-bottom:18px; }
  @media (max-width:520px){ .grid3{ grid-template-columns: 1fr 1fr; } .grid3 .card:first-child{ grid-column: 1/-1; } }

  .stat-label { font-size:12px; color:var(--text-dim); margin:0 0 6px; font-weight:600; }
  .stat-value { font-size:20px; font-weight:800; margin:0; letter-spacing:-0.3px; }
  .stat-value.income { color: var(--income); }
  .stat-value.expense { color: var(--expense); }

  section { margin-bottom: 22px; }
  h2.section-title { font-size:14px; font-weight:700; margin: 0 0 10px; color: var(--text-dim); text-transform:uppercase; letter-spacing:0.4px; }

  .row { display:flex; align-items:center; gap:12px; }
  .space-between { justify-content:space-between; }

  /* Add form */
  .type-switch { display:flex; gap:8px; margin-bottom:14px; }
  .type-switch button {
    flex:1; padding:11px; border-radius:10px; border:1.5px solid var(--border); background:var(--surface-2);
    font-weight:700; font-size:14px; cursor:pointer; color:var(--text-dim);
  }
  .type-switch button.sel-income.active { background:var(--income-bg); color:var(--income); border-color:var(--income); }
  .type-switch button.sel-expense.active { background:var(--expense-bg); color:var(--expense); border-color:var(--expense); }

  label.field { display:block; font-size:12px; font-weight:600; color:var(--text-dim); margin: 12px 0 6px; }
  input, select, textarea {
    width:100%; padding:11px 12px; border-radius:10px; border:1.5px solid var(--border);
    background:var(--surface); color:var(--text); font-size:15px; font-family: inherit;
  }
  input:focus, select:focus, textarea:focus { outline:none; border-color: var(--primary); }
  .amount-input { font-size:24px; font-weight:800; }

  .btn {
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    padding:12px 18px; border-radius:11px; border:none; font-weight:700; font-size:15px; cursor:pointer;
    width:100%; margin-top:16px;
  }
  .btn-primary { background: var(--primary); color:#fff; }
  .btn-primary:disabled { opacity:.5; cursor:not-allowed; }
  .btn-ghost { background:transparent; color: var(--text-dim); border:1.5px solid var(--border); }
  .btn-danger-text { color: var(--expense); background:none; border:none; font-size:13px; font-weight:600; cursor:pointer; padding:6px; }

  .chip-row { display:flex; flex-wrap:wrap; gap:8px; }
  .chip {
    padding:8px 12px; border-radius:20px; border:1.5px solid var(--border); background:var(--surface-2);
    font-size:13px; font-weight:600; cursor:pointer; color:var(--text-dim); user-select:none;
  }
  .chip.active { background:var(--primary-dim); border-color:var(--primary); color:var(--primary); }

  /* Transactions list */
  .filter-bar { display:flex; gap:8px; margin-bottom:14px; overflow-x:auto; }
  .filter-bar button {
    padding:8px 14px; border-radius:9px; border:1.5px solid var(--border); background:var(--surface);
    color:var(--text-dim); font-weight:600; font-size:13px; cursor:pointer; white-space:nowrap;
  }
  .filter-bar button.active { background:var(--primary); border-color:var(--primary); color:#fff; }
  .filter-bar select { width:auto; padding:8px 12px; font-size:13px; font-weight:600; }

  .day-group { margin-bottom:14px; }
  .day-group .day-label { font-size:12px; font-weight:700; color:var(--text-dim); margin: 0 0 8px 4px; display:flex; justify-content:space-between; }
  .tx-item {
    display:flex; align-items:center; gap:12px; padding:12px; background:var(--surface); border:1px solid var(--border);
    border-radius:12px; margin-bottom:8px; cursor:pointer;
  }
  .tx-icon { width:38px;height:38px;border-radius:10px; display:flex;align-items:center;justify-content:center; font-size:18px; flex-shrink:0; }
  .tx-icon.income { background:var(--income-bg); }
  .tx-icon.expense { background:var(--expense-bg); }
  .tx-main { flex:1; min-width:0; }
  .tx-cat { font-weight:700; font-size:14px; margin:0; }
  .tx-note { font-size:12px; color:var(--text-dim); margin:2px 0 0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tx-amount { font-weight:800; font-size:15px; white-space:nowrap; }
  .tx-amount.income { color:var(--income); }
  .tx-amount.expense { color:var(--expense); }
  .empty-state { text-align:center; padding:50px 20px; color:var(--text-dim); }
  .empty-state .big { font-size:40px; margin-bottom:10px; }

  /* Stats */
  .period-switch { display:flex; gap:6px; margin-bottom:16px; }
  .period-switch button { flex:1; padding:9px; border-radius:9px; border:1.5px solid var(--border); background:var(--surface); color:var(--text-dim); font-weight:700; font-size:13px; cursor:pointer; }
  .period-switch button.active { background:var(--primary); border-color:var(--primary); color:#fff; }
  .nav-period { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .nav-period button { background:var(--surface-2); border:1px solid var(--border); border-radius:8px; width:32px; height:32px; cursor:pointer; color:var(--text); font-size:15px; }
  .nav-period .label { font-weight:700; font-size:14px; }
  .cat-bar-row { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .cat-bar-row .cat-name { font-size:12px; width:88px; flex-shrink:0; color:var(--text-dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .cat-bar-track { flex:1; background:var(--surface-2); border-radius:6px; height:10px; overflow:hidden; }
  .cat-bar-fill { height:100%; border-radius:6px; }
  .cat-bar-amt { font-size:12px; font-weight:700; width:76px; text-align:right; flex-shrink:0; }

  /* ---- tax tab ---- */
  .tax-callout { display:flex; gap:10px; align-items:flex-start; background:var(--primary-dim); border:1px solid var(--primary); border-radius:12px; padding:12px 14px; font-size:12.5px; color:var(--text); margin-bottom:14px; line-height:1.6; }
  .tax-callout .cico { flex-shrink:0; }
  .tax-cat-row { display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--border); flex-wrap:wrap; }
  .tax-cat-row:last-child { border-bottom:none; }
  .tax-cat-row .tcr-name { font-size:13px; font-weight:600; flex:1; min-width:90px; }
  .tax-cat-row .tcr-amt { font-size:13px; font-weight:700; color:var(--text-dim); }
  .tax-cat-row select { width:auto; padding:6px 8px; font-size:12px; border-radius:8px; }
  .badge { display:inline-block; padding:2px 9px; border-radius:20px; font-size:11px; font-weight:700; white-space:nowrap; }
  .badge.b-salary { background:var(--primary-dim); color:var(--primary); }
  .badge.b-other { background:var(--other-bg); color:var(--other); }
  .badge.b-business { background:var(--income-bg); color:var(--income); }
  .badge.b-none { background:var(--surface-2); color:var(--text-dim); }
  .tax-section-head { display:flex; align-items:center; gap:10px; margin-bottom:2px; }
  .tax-section-head .tsh-icon { width:32px; height:32px; border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; }
  .tax-section-head .tsh-step { margin-left:auto; font-size:11px; font-weight:700; color:var(--text-dim); background:var(--surface-2); border-radius:20px; padding:2px 9px; }
  .tax-field { display:grid; grid-template-columns:1fr 140px; gap:12px; align-items:start; padding:11px 0; border-bottom:1px solid var(--border); }
  .tax-field:last-child { border-bottom:none; }
  .tax-field label { font-size:13.5px; font-weight:600; display:block; }
  .tax-field .tf-hint { display:block; font-size:11.5px; font-weight:400; color:var(--text-dim); margin-top:3px; line-height:1.5; }
  .tax-field input[type=number] { padding:8px 9px; font-size:13.5px; text-align:right; }
  .tax-checkrow { display:flex; align-items:flex-start; gap:10px; padding:11px 0; border-bottom:1px solid var(--border); }
  .tax-checkrow input { width:18px; height:18px; margin-top:2px; flex-shrink:0; accent-color:var(--primary); }
  .tax-checkrow label { font-size:13.5px; font-weight:600; }
  .tax-checkrow .tf-hint { display:block; font-size:11.5px; font-weight:400; color:var(--text-dim); margin-top:2px; }
  .tax-status-card { border-radius:14px; padding:18px 18px 16px; margin-bottom:16px; }
  .tax-status-card.due { background:var(--expense-bg); }
  .tax-status-card.refund { background:var(--income-bg); }
  .tax-status-card .lbl { font-size:12.5px; color:var(--text-dim); font-weight:700; margin:0 0 4px; }
  .tax-status-card .amt { font-size:28px; font-weight:800; margin:0 0 4px; }
  .tax-status-card.due .amt { color:var(--expense); }
  .tax-status-card.refund .amt { color:var(--income); }
  .tax-status-card .sub { font-size:11.5px; color:var(--text-dim); }
  .tax-stack { height:12px; border-radius:20px; overflow:hidden; display:flex; width:100%; background:var(--surface-2); margin:6px 0 10px; }
  .tax-stack span { height:100%; }
  .tax-legend { display:flex; flex-wrap:wrap; gap:12px; font-size:11.5px; color:var(--text-dim); margin-bottom:14px; }
  .tax-legend .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:5px; vertical-align:middle; }
  .tax-rate-row { display:flex; gap:10px; margin:14px 0 2px; }
  .tax-rate-chip { flex:1; text-align:center; background:var(--surface-2); border-radius:10px; padding:10px 6px; }
  .tax-rate-chip .v { font-size:17px; font-weight:800; }
  .tax-rate-chip .l { font-size:10.5px; color:var(--text-dim); margin-top:2px; }
  .tax-year-row { display:flex; gap:8px; margin-bottom:14px; overflow-x:auto; }
  .tax-year-row button { padding:8px 14px; border-radius:9px; border:1.5px solid var(--border); background:var(--surface); color:var(--text-dim); font-weight:700; font-size:13px; cursor:pointer; white-space:nowrap; }
  .tax-year-row button.active { background:var(--primary); border-color:var(--primary); color:#fff; }

  /* modal */
  .overlay {
    position:fixed; inset:0; background:rgba(0,0,0,0.45); display:flex; align-items:flex-end; justify-content:center;
    z-index:50;
  }
  @media (min-width:600px){ .overlay{ align-items:center; } }
  .sheet {
    background:var(--surface); width:100%; max-width:480px; border-radius: 18px 18px 0 0; padding:20px; max-height:90vh; overflow-y:auto;
  }
  @media (min-width:600px){ .sheet{ border-radius:18px; } }
  .sheet-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
  .sheet-head h3 { margin:0; font-size:16px; }
  .close-x { background:none;border:none;font-size:20px;color:var(--text-dim);cursor:pointer; padding:4px; }

  .toast {
    position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:var(--text); color:var(--bg);
    padding:10px 18px; border-radius:10px; font-size:13px; font-weight:600; z-index:100; opacity:0; transition:opacity .2s;
    pointer-events:none;
  }
  .toast.show { opacity:1; }

  .banner {
    background: var(--primary-dim); border:1px solid var(--primary); color:var(--text); border-radius:12px; padding:10px 14px;
    font-size:12.5px; margin-bottom:16px; display:flex; gap:8px; align-items:flex-start;
  }
  svg text { fill: var(--text-dim); font-size: 10px; font-family: inherit; }

  .icon-btn {
    width:34px; height:34px; border-radius:9px; border:1px solid var(--border); background:var(--surface);
    color:var(--text); font-size:15px; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .header-actions { display:flex; align-items:center; gap:8px; }

  .budget-track { background:var(--surface-2); border-radius:8px; height:14px; overflow:hidden; position:relative; }
  .budget-fill { height:100%; border-radius:8px; transition:width .2s; }
  .budget-fill.ok { background: var(--income); }
  .budget-fill.warn { background: #f2a93b; }
  .budget-fill.over { background: var(--expense); }
  .budget-row-label { display:flex; justify-content:space-between; font-size:12px; margin-bottom:6px; color:var(--text-dim); }
  .budget-item { margin-bottom:14px; }
  .budget-item:last-child { margin-bottom:0; }
  .link-btn { background:none; border:none; color:var(--primary); font-weight:700; font-size:13px; cursor:pointer; padding:6px 0; }

  /* Login screen */
  .login-wrap {
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 16px;
    background: radial-gradient(circle at 15% 15%, color-mix(in srgb, var(--primary) 35%, transparent), transparent 55%),
                radial-gradient(circle at 85% 85%, color-mix(in srgb, var(--income) 30%, transparent), transparent 55%),
                linear-gradient(150deg, var(--primary) 0%, #7aa6ff 45%, var(--income) 100%);
    position:relative; overflow:hidden;
  }
  .login-wrap::before {
    content:''; position:absolute; inset:0;
    background-image: radial-gradient(rgba(255,255,255,0.16) 1.5px, transparent 1.5px);
    background-size: 26px 26px; opacity:0.5; pointer-events:none;
  }
  .login-card {
    background:var(--surface); border:1px solid var(--border); border-radius: var(--radius);
    box-shadow: 0 20px 45px rgba(0,0,0,0.25), 0 4px 12px rgba(0,0,0,0.12);
    padding:28px 22px; width:100%; max-width:360px; position:relative; z-index:1;
  }
  .profile-list { display:flex; flex-direction:column; gap:8px; }
  .profile-btn {
    display:flex; align-items:center; gap:12px; width:100%; text-align:left; padding:11px 12px;
    border-radius:12px; border:1.5px solid var(--border); background:var(--surface-2); cursor:pointer;
    font-size:15px; font-weight:600; color:var(--text);
  }
  .profile-btn:hover { border-color:var(--primary); }
  .profile-avatar {
    width:34px; height:34px; border-radius:50%; background:linear-gradient(135deg,var(--primary),#7aa6ff);
    color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:15px; flex-shrink:0;
  }
  .profile-del { margin-left:auto; background:none; border:none; color:var(--text-dim); font-size:14px; cursor:pointer; padding:4px; flex-shrink:0; }
  .pin-dots { display:flex; gap:12px; justify-content:center; margin:18px 0; }
  .pin-dots span { width:14px; height:14px; border-radius:50%; border:1.5px solid var(--border); background:transparent; }
  .pin-dots span.filled { background:var(--primary); border-color:var(--primary); }
  .pin-pad { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .pin-pad button {
    padding:16px 0; border-radius:12px; border:1.5px solid var(--border); background:var(--surface-2);
    font-size:19px; font-weight:700; cursor:pointer; color:var(--text);
  }
  .pin-pad button.pin-action { font-size:14px; color:var(--text-dim); }
  .who .logout-link { background:none; border:none; color:var(--text-dim); font-size:12px; cursor:pointer; text-decoration:underline; padding:0; margin-left:6px; }
</style>
</head>
<body>
<div id="loginScreen" style="display:none;">
  <div class="login-wrap">
    <div class="login-card">
      <div class="logo" style="width:52px;height:52px;font-size:26px;margin:0 auto 14px;">💰</div>
      <h1 style="text-align:center;font-size:18px;margin:0 0 4px;">บัญชีรายรับ-รายจ่าย</h1>
      <p style="text-align:center;color:var(--text-dim);font-size:13px;margin:0 0 20px;">เลือกผู้ใช้ของคุณเพื่อเข้าสู่ระบบ</p>
      <div id="profileList" class="profile-list"></div>
      <button class="btn btn-ghost" id="btnAddProfile" style="margin-top:14px;">+ เพิ่มผู้ใช้ใหม่</button>
    </div>
  </div>
</div>

<div id="app" style="display:none;">
  <header class="topbar">
    <div class="brand">
      <div class="logo">💰</div>
      <div>
        <h1>บัญชีรายรับ-รายจ่าย</h1>
        <p class="sub" id="greeting">สำหรับครอบครัวและธุรกิจของคุณ</p>
      </div>
    </div>
    <div class="header-actions">
      <div class="who" id="whoBox"></div>
      <button class="icon-btn" id="btnCatSettings" title="จัดการหมวดหมู่">🏷️</button>
      <button class="icon-btn" id="btnBudgetSettings" title="ตั้งงบประมาณ">🎯</button>
      <button class="icon-btn" id="btnExport" title="ส่งออกเป็น CSV">⬇️</button>
      <button class="icon-btn" id="btnLogout" title="ออกจากระบบ">🚪</button>
    </div>
  </header>

  <div id="storageBanner"></div>

  <nav class="tabs">
    <button data-tab="dashboard" class="active">ภาพรวม</button>
    <button data-tab="add">เพิ่มรายการ</button>
    <button data-tab="list">รายการ</button>
    <button data-tab="stats">สถิติ</button>
    <button data-tab="tax">ภาษี</button>
  </nav>

  <div id="view-dashboard"></div>
  <div id="view-add" style="display:none;"></div>
  <div id="view-list" style="display:none;"></div>
  <div id="view-stats" style="display:none;"></div>
  <div id="view-tax" style="display:none;"></div>
</div>

<div id="modalRoot"></div>
<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  /* ---------------- constants ---------------- */
  var DEFAULT_CATS = {
    income: [

      try {
        var raw = localStorage.getItem(this.localKey + '__' + this.profileId);
        return raw ? JSON.parse(raw) : [];
      } catch(e){ return []; }
    },
    _localSave(list){
      try { localStorage.setItem(this.localKey + '__' + this.profileId, JSON.stringify(list)); } catch(e){}
    },

    subscribe(cb){
      this.listeners.push(cb);
      if (this.mode === 'cloud') {
        if (!this._unsub) {
          var self = this;
          this._unsub = this.col().orderBy('date','desc').limit(2000).onSnapshot(function(snap){
            self._cache = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
            self.listeners.forEach(function(l){ l(self._cache); });
          }, function(err){
            console.error('db error', err);
            toast('เกิดข้อผิดพลาดในการซิงค์ข้อมูล');
          });
        } else if (this._cache) {
          cb(this._cache);
        }
      } else {
        var list = this._localAll();
        this._cache = list;
        cb(list);
      }
    },

    async add(tx){
      tx = Object.assign({}, tx, { createdAt: Date.now() });
      if (this.mode === 'cloud') {
        await this.col().doc(uid()).set(tx);
      } else {
        var list = this._localAll();
        tx.id = uid();
        list.push(tx);
        this._localSave(list);
        this._cache = list;
        this.listeners.forEach(function(l){ l(list); });
      }
    },
    async update(id, patch){
      if (this.mode === 'cloud') {
        await this.col().doc(id).update(patch);
      } else {
        var list = this._localAll();
        for (var i=0;i<list.length;i++){ if (list[i].id===id) list[i] = Object.assign({}, list[i], patch); }
        this._localSave(list);
        this._cache = list;
        this.listeners.forEach(function(l){ l(list); });
      }
    },
    async remove(id){
      if (this.mode === 'cloud') {
        await this.col().doc(id).delete();
      } else {
        var list = this._localAll().filter(function(t){ return t.id!==id; });
        this._localSave(list);
        this._cache = list;
        this.listeners.forEach(function(l){ l(list); });
      }
    },

  // mode: false = verifying PIN to log in an existing profile; true = setting a new PIN for a new profile
  function openPinModal(profile, isNew){
    var root = document.getElementById('modalRoot');
    var pin = '';
    var pin2 = '';
    var stage = isNew ? 'set' : 'verify'; // set -> confirm -> done

    function draw(){
      var title = stage==='verify' ? ('ใส่ PIN ของ ' + escapeHtml(profile.name))
        : stage==='set' ? ('ตั้ง PIN 4 หลักสำหรับ "'+escapeHtml(profile.name)+'"')
        : ('ยืนยัน PIN อีกครั้ง');
      var cur = stage==='confirm' ? pin2 : pin;
      var dots = '<div class="pin-dots">' + [0,1,2,3].map(function(i){
        return '<span class="'+(i<cur.length?'filled':'')+'"></span>';
      }).join('') + '</div>';
      var html = '<div class="overlay" id="ov"><div class="sheet">';
      html += '<div class="sheet-head"><h3>'+title+'</h3><button class="close-x" id="ovClose">✕</button></div>';
      html += dots;
      html += '<div class="pin-pad">';
      ['1','2','3','4','5','6','7','8','9'].forEach(function(n){ html += '<button data-num="'+n+'">'+n+'</button>'; });
      html += '<button class="pin-action" data-clear="1">ล้าง</button><button data-num="0">0</button><button class="pin-action" data-back="1">⌫</button>';
      html += '</div></div></div>';
      root.innerHTML = html;
      document.getElementById('ovClose').addEventListener('click', closeModal);
      document.getElementById('ov').addEventListener('click', function(e){ if(e.target.id==='ov') closeModal(); });
      root.querySelectorAll('[data-num]').forEach(function(b){
        b.addEventListener('click', function(){ pressNum(b.getAttribute('data-num')); });
      });
      root.querySelector('[data-clear]').addEventListener('click', function(){
        if (stage==='confirm') pin2=''; else pin='';
        draw();
      });
      root.querySelector('[data-back]').addEventListener('click', function(){
        if (stage==='confirm') pin2 = pin2.slice(0,-1); else pin = pin.slice(0,-1);
        draw();
      });
    }

    async function pressNum(n){
      if (stage==='confirm') {
        if (pin2.length>=4) return;
        pin2 += n;
        draw();
        if (pin2.length===4) {
          if (pin2===pin) {
            var created = await Store.addProfile(profile.name, pin2);
            closeModal();
            setSession(created);
            toast('สร้างผู้ใช้เรียบร้อย');
            enterApp(created);
          } else {
            toast('PIN ไม่ตรงกัน กรุณาลองใหม่');
            pin=''; pin2=''; stage='set'; draw();
          }
        }
        return;
      }
      if (pin.length>=4) return;
      pin += n;
      draw();
      if (pin.length===4) {
        if (stage==='set') {
          stage='confirm'; draw();
        } else {
          // verify existing profile
          if (pin===profile.pin) {
            closeModal();
            setSession(profile);
            enterApp(profile);
          } else {
            toast('PIN ไม่ถูกต้อง');
            pin=''; draw();
          }
        }
      }
    }

    draw();
  }

  /* ---------------- aggregation helpers ---------------- */
  function ymd(dateStr){ return dateStr.split('-'); } // [Y,M,D]
  function sumBy(list, pred){
    var inc=0, exp=0;
    list.forEach(function(t){
      if (!pred || pred(t)) {
        if (t.type==='income') inc += Number(t.amount)||0; else exp += Number(t.amount)||0;
      }
    });
    return {income:inc, expense:exp, balance: inc-exp};
  }
  function monthKey(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }

  /* ---------------- DASHBOARD ---------------- */
  function renderDashboard(){
    var el = document.getElementById('view-dashboard');
    var now = new Date();
    var todayStr = todayISO();
    var curMonth = monthKey(now);
    var curYear = String(now.getFullYear());

    var monthTx = allTx().filter(function(t){ return t.date && t.date.slice(0,7)===curMonth; });
    var todayTx = allTx().filter(function(t){ return t.date===todayStr; });
    var yearTx = allTx().filter(function(t){ return t.date && t.date.slice(0,4)===curYear; });

    var mSum = sumBy(monthTx);
    var tSum = sumBy(todayTx);
    var ySum = sumBy(yearTx);

    var html = '';

  function renderLast7Chart(){
    var days = [];
    for (var i=6;i>=0;i--){
      var d = new Date();
      d.setDate(d.getDate()-i);
      var key = d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
      var s = sumBy(allTx().filter(function(t){return t.date===key;}));
      days.push({label: DAYS_TH[d.getDay()], date:d.getDate(), income:s.income, expense:s.expense});
    }
    var max = Math.max(1, Math.max.apply(null, days.map(function(d){return Math.max(d.income,d.expense);})));
    var w=280, h=120, barW= (w/7)*0.6, gap=(w/7);
    var bars = days.map(function(d,i){
      var x = i*gap + (gap-barW)/2;
      var hi = (d.income/max)*(h-24);
      var he = (d.expense/max)*(h-24);
      var s = '';
      s += '<rect x="'+x+'" y="'+(h-24-hi)+'" width="'+(barW/2-1)+'" height="'+hi+'" fill="var(--income)" rx="2"/>';
      s += '<rect x="'+(x+barW/2+1)+'" y="'+(h-24-he)+'" width="'+(barW/2-1)+'" height="'+he+'" fill="var(--expense)" rx="2"/>';
      s += '<text x="'+(x+barW/2)+'" y="'+(h-8)+'" text-anchor="middle">'+d.label+'</text>';
      return s;
    }).join('');
    return '<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;height:110px;" preserveAspectRatio="xMidYMid meet">'+bars+'</svg>'+
      '<div style="display:flex;gap:14px;justify-content:center;font-size:11px;color:var(--text-dim);margin-top:4px;">'+
      '<span>🟢 รายรับ</span><span>🔴 รายจ่าย</span></div>';
  }

  /* ---------------- BUDGET ---------------- */
  function budgetBarClass(pct){
    if (pct >= 100) return 'over';
    if (pct >= 80) return 'warn';
    return 'ok';
  }

  // Returns list of {label, pct, status} for overall/category budgets that are
  // at or above 80% used (status 'warn') or at/over 100% (status 'over').
  function budgetAlerts(monthTx){
    var b = STATE.budget || {overall:0, categories:{}};
    var alerts = [];
    var expByCat = {}, totalExp = 0;
    monthTx.forEach(function(t){
      if (t.type!=='expense') return;
      expByCat[t.category] = (expByCat[t.category]||0) + Number(t.amount||0);
      totalExp += Number(t.amount||0);
    });
    if (b.overall > 0) {
      var pctAll = (totalExp/b.overall)*100;
      if (pctAll >= 80) alerts.push({label:'งบรวม', pct:pctAll, status: pctAll>=100?'over':'warn'});
    }
    Object.keys(b.categories||{}).forEach(function(cat){
      var lim = b.categories[cat];
      if (!(lim > 0)) return;
      var spent = expByCat[cat] || 0;
      var pct = (spent/lim)*100;
      if (pct >= 80) alerts.push({label:cat, pct:pct, status: pct>=100?'over':'warn'});
    });
    return alerts;
  }

  function alertsBannerHtml(alerts){
    if (!alerts || !alerts.length) return '';
    var rows = alerts.map(function(a){
      return (a.status==='over' ? '🚨 เกินงบ' : '⚠️ ใกล้เกินงบ') + ' "'+escapeHtml(a.label)+'" แล้ว ('+Math.round(a.pct)+'%)';
    }).join('<br>');
    var over = alerts.some(function(a){return a.status==='over';});
    return '<div class="banner" style="background:var(--expense-bg);border-color:var(--expense);'+(over?'':'opacity:.92;')+'">'+
      (over?'🚨':'⚠️')+' <div>'+rows+'</div></div>';
  }

  function renderBudgetSection(monthTx){
    var b = STATE.budget || {overall:0, categories:{}};
    var hasOverall = b.overall && b.overall > 0;
    var catBudgets = Object.keys(b.categories||{}).filter(function(k){ return b.categories[k] > 0; });
    if (!hasOverall && catBudgets.length===0) {
      return '<p style="font-size:13px;color:var(--text-dim);margin:0 0 8px;">ยังไม่ได้ตั้งงบประมาณ</p><button class="link-btn budgetSetLink">+ ตั้งงบประมาณเดือนนี้</button>';
    }
    var expByCat = {};
    var totalExp = 0;
    monthTx.forEach(function(t){
      if (t.type!=='expense') return;
      expByCat[t.category] = (expByCat[t.category]||0) + Number(t.amount||0);
      totalExp += Number(t.amount||0);
    });
    var html = '';
    if (hasOverall) {
      var pct = Math.min(100, (totalExp/b.overall)*100);
      html += '<div class="budget-item"><div class="budget-row-label"><span>งบรวม</span><span>฿'+fmt(totalExp)+' / ฿'+fmt(b.overall)+'</span></div>' +
        '<div class="budget-track"><div class="budget-fill '+budgetBarClass(pct)+'" style="width:'+pct+'%;"></div></div></div>';
    }
    catBudgets.forEach(function(cat){
      var spent = expByCat[cat] || 0;
      var lim = b.categories[cat];
      var pct = Math.min(100, (spent/lim)*100);
      html += '<div class="budget-item"><div class="budget-row-label"><span>'+escapeHtml(cat)+'</span><span>฿'+fmt(spent)+' / ฿'+fmt(lim)+'</span></div>' +
        '<div class="budget-track"><div class="budget-fill '+budgetBarClass(pct)+'" style="width:'+pct+'%;"></div></div></div>';
    });
    html += '<button class="link-btn budgetSetLink">แก้ไขงบประมาณ</button>';
    return html;
  }

  /* ---------------- EXPORT ---------------- */
  function csvEscape(v){
    v = String(v==null?'':v);
    if (/[",\n]/.test(v)) return '"' + v.replace(/"/g,'""') + '"';
    return v;
  }
  function buildCsv(list){
    var rows = [['วันที่','ประเภท','หมวดหมู่','จำนวนเงิน','บันทึก']];
    list.slice().sort(function(a,b){ return a.date<b.date?-1:1; }).forEach(function(t){
      rows.push([t.date, t.type==='income'?'รายรับ':'รายจ่าย', t.category, t.amount, t.note||'']);
    });
    return '\uFEFF' + rows.map(function(r){ return r.map(csvEscape).join(','); }).join('\r\n');
  }
  async function exportCsv(){
    var list = allTx();
    if (list.length===0) { toast('ไม่มีข้อมูลให้ส่งออก'); return; }
    var csv = buildCsv(list);
    var fname = 'บัญชีรายรับรายจ่าย_' + todayISO() + '.csv';
    if (Store.downloads) {
      try {
        await Store.downloads.save({ filename: fname, data: csv });
        toast('ส่งออกไฟล์เรียบร้อย');
      } catch(e){
        if (e && e.code === 'declined') return;
        console.error(e);
        toast('ไม่สามารถส่งออกไฟล์ได้ในขณะนี้');
      }
    } else {
      try {
        var blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url; a.download = fname;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        URL.revokeObjectURL(url);
        toast('ส่งออกไฟล์เรียบร้อย');
      } catch(e){ console.error(e); toast('ไม่สามารถส่งออกไฟล์ได้'); }
    }
  }

  function filteredForList(){
    var now = new Date();
    var list = allTx();
    if (STATE.listFilter==='day') {
      var t = todayISO();
      list = list.filter(function(x){ return x.date===t; });
    } else if (STATE.listFilter==='month') {
      var mk = monthKey(now);
      list = list.filter(function(x){ return x.date && x.date.slice(0,7)===mk; });
    } else if (STATE.listFilter==='year') {
      var yk = String(now.getFullYear());
      list = list.filter(function(x){ return x.date && x.date.slice(0,4)===yk; });

  function categoryPieSvg(list){
    var byCat = {}, total = 0;
    list.forEach(function(t){
      if (t.type!=='expense') return;
      byCat[t.category] = (byCat[t.category]||0) + Number(t.amount||0);
      total += Number(t.amount||0);
    });
    var entries = Object.keys(byCat).map(function(k){return {cat:k, amt:byCat[k]};}).sort(function(a,b){return b.amt-a.amt;});
    if (!total || entries.length===0) return '';
    var size=140, r=54, cx=size/2, cy=size/2, circ=2*Math.PI*r;
    var offset=0;
    var circles = entries.map(function(e,i){
      var frac = e.amt/total;
      var dash = frac*circ;
      var seg = '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+CAT_COLORS[i % CAT_COLORS.length]+'" stroke-width="20" '+
        'stroke-dasharray="'+dash+' '+(circ-dash)+'" stroke-dashoffset="'+(-offset)+'" transform="rotate(-90 '+cx+' '+cy+')"></circle>';
      offset += dash;
      return seg;
    }).join('');
    var legend = entries.slice(0,6).map(function(e,i){
      var pct = Math.round((e.amt/total)*100);
      return '<div style="display:flex;align-items:center;gap:6px;font-size:12px;margin-bottom:6px;">'+
        '<span style="width:10px;height:10px;border-radius:3px;background:'+CAT_COLORS[i % CAT_COLORS.length]+';flex-shrink:0;"></span>'+
        '<span style="flex:1;color:var(--text-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+escapeHtml(e.cat)+'</span>'+
        '<span style="font-weight:700;">'+pct+'%</span></div>';
    }).join('');
    return '<div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:center;margin-bottom:14px;">'+
      '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'" style="flex-shrink:0;">'+circles+
      '<circle cx="'+cx+'" cy="'+cy+'" r="'+(r-20)+'" fill="var(--surface)"></circle>'+
      '<text x="'+cx+'" y="'+(cy-4)+'" text-anchor="middle" style="font-size:11px;fill:var(--text-dim);">รวม</text>'+
      '<text x="'+cx+'" y="'+(cy+13)+'" text-anchor="middle" style="font-size:13px;font-weight:800;fill:var(--text);">฿'+fmt(total)+'</text>'+
      '</svg>'+
      '<div style="flex:1;min-width:140px;">'+legend+'</div>'+
      '</div>';
  }

  function taxAvailableYears(){
    var set = {};
    allTx().forEach(function(t){ if (t.date) set[t.date.slice(0,4)] = true; });
    set[String(STATE.taxYear)] = true;

  function defaultTaxMapping(){
    var m = {};
    CATS.income.forEach(function(c){
      var k = c.k;
      if (k==='เงินเดือน' || k==='โบนัส') m[k]='salary';
      else if (k==='รายได้เสริม' || k==='เงินลงทุน') m[k]='other12';
      else if (k==='ขายของ') m[k]='business';
      else m[k]='other12';
    });
    return m;
  }

  function taxIncomeByCategory(year){
    var byCat = {};
    allTx().forEach(function(t){
      if (t.type!=='income' || !t.date || t.date.slice(0,4)!==String(year)) return;
      byCat[t.category] = (byCat[t.category]||0) + (Number(t.amount)||0);
    });
    return byCat;
  }

  function taxAutoTotals(year, mapping){
    var byCat = taxIncomeByCategory(year);
    var totals = { salary:0, other12:0, business:0, none:0 };
    Object.keys(byCat).forEach(function(cat){
      var type = mapping[cat] || 'other12';
      totals[type] = (totals[type]||0) + byCat[cat];
    });
    return { byCat: byCat, totals: totals };
  }

  function taxBrackets(){
    return [
      [0,150000,0],[150000,300000,0.05],[300000,500000,0.10],[500000,750000,0.15],
      [750000,1000000,0.20],[1000000,2000000,0.25],[2000000,5000000,0.30],[5000000,Infinity,0.35]
    ];
  }

  function calcTaxFromNet(net){
    var tax=0, marginal=0, perBracket=[];
    taxBrackets().forEach(function(b){
      var lo=b[0], hi=b[1], rate=b[2];
      var taxableInBand = Math.max(0, Math.min(net,hi)-lo);
      var t = taxableInBand*rate;
      tax += t;
      perBracket.push({lo:lo,hi:hi,rate:rate,taxableInBand:taxableInBand,t:t});
      if (taxableInBand>0) marginal = rate;
    });
    return { tax:tax, perBracket:perBracket, marginal:marginal };
  }

  function taxFullCalc(){
    var v = STATE.taxValues || TAX_FIELD_DEFAULTS;
    var auto = taxAutoTotals(STATE.taxYear, STATE.taxMapping || defaultTaxMapping());
    var salary = v.manualSalary!=null ? Number(v.manualSalary)||0 : auto.totals.salary;
    var other12 = v.manualOther12!=null ? Number(v.manualOther12)||0 : auto.totals.other12;
    var business = v.manualBusiness!=null ? Number(v.manualBusiness)||0 : auto.totals.business;
    var withheld = Number(v.withheld)||0;

    var employmentIncome = salary+other12;
    var expense = Math.min(employmentIncome*0.5, 100000);
    var totalIncome = employmentIncome+business;
    var incomeAfterExpense = (employmentIncome-expense)+business;

    var detailItems = [];
    var personal = 60000; detailItems.push(['ลดหย่อนส่วนตัว',60000]);
    if (v.spouse){ personal+=60000; detailItems.push(['คู่สมรส',60000]); }
    var cb=(Number(v.childBasic)||0)*30000; if(cb>0){ personal+=cb; detailItems.push(['บุตร (อัตราปกติ)',cb]); }
    var ce=(Number(v.childEnh)||0)*60000; if(ce>0){ personal+=ce; detailItems.push(['บุตร (อัตราเพิ่ม)',ce]); }
    var pr=Math.min(Number(v.parents)||0,4)*30000; if(pr>0){ personal+=pr; detailItems.push(['บิดามารดา',pr]); }
    var db=(Number(v.disabled)||0)*60000; if(db>0){ personal+=db; detailItems.push(['ผู้พิการ/ทุพพลภาพ',db]); }

    var sso=Math.min(Number(v.sso)||0,9000); if(sso>0) detailItems.push(['ประกันสังคม',sso]);
    var healthSelf=Math.min(Number(v.healthIns)||0,25000);
    var life=Math.min(Number(v.lifeIns)||0, Math.max(0,100000-healthSelf));
    if(life>0) detailItems.push(['ประกันชีวิต/สะสมทรัพย์',life]);
    if(healthSelf>0) detailItems.push(['ประกันสุขภาพตนเอง',healthSelf]);
    var parentHealth=Math.min(Number(v.parentHealthIns)||0,15000); if(parentHealth>0) detailItems.push(['ประกันสุขภาพบิดามารดา',parentHealth]);

    var provident=Math.min(Number(v.providentFund)||0,500000);
    var pension=Math.min(Number(v.pensionIns)||0, Math.min(totalIncome*0.15,200000));
    var rmf=Math.min(Number(v.rmf)||0, Math.min(totalIncome*0.30,500000));
    var ssf=Math.min(Number(v.ssf)||0, Math.min(totalIncome*0.30,200000));
    var nsf=Math.min(Number(v.nsf)||0,13200);
    var retirementSum=provident+pension+rmf+ssf+nsf;
    if (retirementSum>500000) retirementSum=500000;
    if (retirementSum>0) detailItems.push(['กองทุนเกษียณรวม',retirementSum]);

    var homeInterest=Math.min(Number(v.homeInterest)||0,100000); if(homeInterest>0) detailItems.push(['ดอกเบี้ยที่อยู่อาศัย',homeInterest]);

    var otherDeductions = sso+life+healthSelf+parentHealth+retirementSum+homeInterest;
    var totalDeductions = personal+otherDeductions;
    var incomeBeforeDonation = Math.max(0, incomeAfterExpense-totalDeductions);

    var donateInput = (Number(v.donateGeneral)||0)+(Number(v.donateDouble)||0)*2;
    var donationCap = incomeBeforeDonation*0.10;
    var donation = Math.min(donateInput, donationCap);
    if (donation>0) detailItems.push(['เงินบริจาค',donation]);

    var netIncome = Math.max(0, incomeBeforeDonation-donation);
    var r = calcTaxFromNet(netIncome);
    var balance = r.tax - withheld;
    var takeHome = Math.max(0, totalIncome - r.tax);

    return {
      salary:salary, other12:other12, business:business, withheld:withheld, totalIncome:totalIncome,
      expense:expense, totalDeductions:totalDeductions, donation:donation, netIncome:netIncome,
      tax:r.tax, perBracket:r.perBracket, marginal:r.marginal, balance:balance, takeHome:takeHome,
      detailItems:detailItems, auto:auto
    };
  }

    } else {

        '<p class="sub">ภาษีที่คำนวณได้ ฿'+fmt(c.tax)+' น้อยกว่าที่ถูกหัก ณ ที่จ่ายไว้ ฿'+fmt(c.withheld)+'</p>';
    }

    document.getElementById('taxTotalIncome').textContent = '฿'+fmt(c.totalIncome);
    document.getElementById('taxExpense').textContent = '฿'+fmt(c.expense);
    document.getElementById('taxDeductions').textContent = '฿'+fmt(c.totalDeductions);
    document.getElementById('taxDonation').textContent = '฿'+fmt(c.donation);
    document.getElementById('taxNet').textContent = '฿'+fmt(c.netIncome);
    document.getElementById('taxTax').textContent = '฿'+fmt(c.tax);
    document.getElementById('taxEffRate').textContent = (c.totalIncome>0 ? (c.tax/c.totalIncome*100).toFixed(1):'0.0')+'%';
    document.getElementById('taxMarginal').textContent = (c.marginal*100).toFixed(0)+'%';
    document.getElementById('taxMonthly').textContent = '฿'+fmt(c.takeHome/12);

    var base = c.totalIncome>0 ? c.totalIncome : 1;
    var segExempt = Math.max(0, c.totalIncome - c.tax - Math.max(0, c.netIncome - c.tax));
    var segTax = Math.min(c.tax, c.totalIncome);
    var segNet = Math.max(0, c.totalIncome - segExempt - segTax);
    document.getElementById('taxStack').innerHTML =
      '<span style="width:'+(segExempt/base*100)+'%;background:var(--other)"></span>' +
      '<span style="width:'+(segTax/base*100)+'%;background:var(--expense)"></span>' +
      '<span style="width:'+(segNet/base*100)+'%;background:var(--income)"></span>';

    var dl = document.getElementById('taxDetailList');
    if (!c.detailItems.length) {
      dl.innerHTML = '<p style="color:var(--text-dim);font-size:12.5px;text-align:center;padding:8px 0;">ยังไม่ได้ใช้สิทธิลดหย่อนเพิ่มเติมนอกจากลดหย่อนส่วนตัว</p>';
    } else {
      var maxD = Math.max.apply(null, c.detailItems.map(function(x){return x[1];}));
      dl.innerHTML = c.detailItems.map(function(item,i){
        var pct = (item[1]/maxD*100);
        var color = CAT_COLORS[i % CAT_COLORS.length];
        return '<div class="cat-bar-row"><span class="cat-name" style="width:130px;">'+escapeHtml(item[0])+'</span>' +
          '<div class="cat-bar-track"><div class="cat-bar-fill" style="width:'+pct+'%;background:'+color+';"></div></div>' +
          '<span class="cat-bar-amt">฿'+fmt(item[1])+'</span></div>';
      }).join('');
    }

    var maxB = Math.max.apply(null, c.perBracket.map(function(b){return b.taxableInBand;})) || 1;
    document.getElementById('taxBrackets').innerHTML = c.perBracket.map(function(b){
      var lbl = b.hi===Infinity ? ('เกิน '+fmt(b.lo)) : (fmt(b.lo)+'–'+fmt(b.hi));
      var pct = (b.taxableInBand/maxB*100);
      var color = b.taxableInBand>0 ? 'var(--expense)' : 'var(--other)';
      return '<div class="cat-bar-row"><span class="cat-name" style="width:130px;">'+lbl+' ('+(b.rate*100).toFixed(0)+'%)</span>' +
        '<div class="cat-bar-track"><div class="cat-bar-fill" style="width:'+pct+'%;background:'+color+';"></div></div>' +
        '<span class="cat-bar-amt">฿'+fmt(b.t)+'</span></div>';
    }).join('');
  }

  }

  function taxManualField(id, label, hint, val){
    return '<div class="tax-field"><label>'+label+'<span class="tf-hint">'+hint+'</span></label>' +
      '<input type="number" min="0" step="1000" id="tx_'+id+'" placeholder="อัตโนมัติ" value="'+(val==null?'':val)+'"></div>';
  }

  /* ---------------- master render ---------------- */
  function render(){
    if (STATE.tab==='dashboard') renderDashboard();
    else if (STATE.tab==='add') renderAddView();
    else if (STATE.tab==='list') renderListView();
    else if (STATE.tab==='stats') renderStatsView();
    else if (STATE.tab==='tax') renderTaxView();
  }

  /* ---------------- boot ---------------- */
  document.getElementById('btnBudgetSettings').addEventListener('click', openBudgetModal);
  document.getElementById('btnExport').addEventListener('click', exportCsv);
  document.getElementById('btnCatSettings').addEventListener('click', openCategoryModal);

  (async function boot(){
    await Store.init();
    await Store.initDownloads();
    var session = getSession();
    if (session && session.id) {
      var profiles = await Store.getProfiles();
      var match = profiles.find(function(p){ return p.id === session.id; });
      if (match) {
        await enterApp(match);
        return;
      }
      clearSession();
    }
    showLoginScreen();
  })();

})();
</script>
</body>
</html>
